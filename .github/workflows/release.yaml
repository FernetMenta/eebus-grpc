name: Release Binaries & Docker (GHCR)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Enter tag/version (e.g. v2.0.1)'
        required: true

permissions:
  contents: write
  packages: write # Required for pushing images to GHCR

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag_name || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Build Binaries
        run: |
          TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          echo "Building binaries for version: $TAG"
          mkdir -p dist
          
          GOOS=windows GOARCH=amd64 go build -ldflags="-X main.version=${TAG}" -o dist/eebus-grpc-windows-amd64.exe ./cmd/main.go
          GOOS=linux GOARCH=amd64 go build -ldflags="-X main.version=${TAG}" -o dist/eebus-grpc-linux-amd64 ./cmd/main.go
          GOOS=linux GOARCH=arm64 go build -ldflags="-X main.version=${TAG}" -o dist/eebus-grpc-linux-arm64 ./cmd/main.go

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# --- DOCKER BUILD & PUSH TO GHCR ---

      - name: Lowercase Repository Name
        run: |
          echo "REPO_LOWERCASE=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWERCASE }}:${{ github.event.inputs.tag_name || github.ref_name }}
            ghcr.io/${{ env.REPO_LOWERCASE }}:latest